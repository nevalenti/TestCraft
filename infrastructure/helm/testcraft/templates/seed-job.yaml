{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: migrator
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "testcraft.podSecurityContext" (dict "uid" 1001 "gid" 1001) | nindent 8 }}
      containers:
        - name: seed
          image: {{ .Values.images.migrator.repository }}:{{ .Values.images.migrator.tag }}
          imagePullPolicy: {{ .Values.images.migrator.pullPolicy }}
          args: ["seed"]
          securityContext:
            {{- include "testcraft.containerSecurityContext" dict | nindent 12 }}
          env:
            {{- include "testcraft.appDatabaseEnv" . | nindent 12 }}
            {{- with .Values.seed.ownerId }}
            - name: SEED_OWNER_USER_ID
              value: {{ . | quote }}
            {{- end }}
          resources:
            requests:
              memory: 64Mi
              cpu: "50m"
            limits:
              memory: 256Mi
              cpu: "500m"
{{- end }}
