{{- if .Values.backups.offsite.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-backup-sync
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backups.offsite.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: offsite-backup-sync
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            {{- include "testcraft.podSecurityContext" (dict "uid" 1000 "gid" 1000) | nindent 12 }}
          containers:
            - name: sync
              image: {{ .Values.thirdPartyImages.minio_client }}
              securityContext:
                {{- include "testcraft.containerSecurityContext" dict | nindent 16 }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                  mc alias set offsite "{{ .Values.backups.offsite.endpoint }}" \
                    "$OFFSITE_BACKUP_ACCESS_KEY" "$OFFSITE_BACKUP_SECRET_KEY"
                  mc mirror --overwrite --remove \
                    "local/{{ .Values.backups.minioBucket }}/" \
                    "offsite/{{ .Values.backups.offsite.bucket }}/"
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: testcraft-secrets
                      key: MINIO_ROOT_USER
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: testcraft-secrets
                      key: MINIO_ROOT_PASSWORD
                - name: OFFSITE_BACKUP_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: testcraft-secrets
                      key: OFFSITE_BACKUP_ACCESS_KEY
                - name: OFFSITE_BACKUP_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: testcraft-secrets
                      key: OFFSITE_BACKUP_SECRET_KEY
              resources:
                requests:
                  memory: 32Mi
                  cpu: "25m"
                limits:
                  memory: 128Mi
                  cpu: "250m"
{{- end }}
