apiVersion: v1
kind: ConfigMap
metadata:
  name: realm
  namespace: {{ .Release.Namespace }}
data:
  testcraft-realm.json: |
{{ .Files.Get "files/keycloak/realm.json" | indent 4 }}
{{- with .Values.keycloak.extraUsers }}
  testcraft-users-0.json: |
    {{- dict "realm" "testcraft" "users" . | toPrettyJson | nindent 4 }}
{{- end }}
