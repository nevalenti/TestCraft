apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.keycloak }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: copy-realm
          image: {{ .Values.thirdPartyImages.busybox }}
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data/import
              if [ -n "$GITHUB_CLIENT_ID" ]; then GITHUB_ENABLED=true; else GITHUB_ENABLED=false; fi
              if [ -n "$GOOGLE_CLIENT_ID" ]; then GOOGLE_ENABLED=true; else GOOGLE_ENABLED=false; fi
              sed "s|\"GITHUB_IDP_ENABLED\"|$GITHUB_ENABLED|g; s|\${GITHUB_CLIENT_ID}|$GITHUB_CLIENT_ID|g; s|\${GITHUB_CLIENT_SECRET}|$GITHUB_CLIENT_SECRET|g; s|\"GOOGLE_IDP_ENABLED\"|$GOOGLE_ENABLED|g; s|\${GOOGLE_CLIENT_ID}|$GOOGLE_CLIENT_ID|g; s|\${GOOGLE_CLIENT_SECRET}|$GOOGLE_CLIENT_SECRET|g; s|\${KEYCLOAK_ADMIN_CLIENT_SECRET}|$KEYCLOAK_ADMIN_CLIENT_SECRET|g" \
                /realm-source/testcraft-realm.json > /data/import/testcraft-realm.json
          env:
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: GITHUB_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: GITHUB_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
            - name: realm-source
              mountPath: /realm-source
        - name: install-theme
          image: {{ .Values.thirdPartyImages.keycloak }}
          command:
            - /bin/sh
            - -c
            - |
              cp -r /opt/keycloak/themes/* /themes/ &&
              mkdir -p /themes/dracula/login &&
              cp /theme-source/theme.properties /themes/dracula/login/theme.properties &&
              cp /theme-source/template.ftl /themes/dracula/login/template.ftl &&
              cp /theme-source/login.ftl /themes/dracula/login/login.ftl &&
              cp /theme-source/register.ftl /themes/dracula/login/register.ftl &&
              cp /theme-source/error.ftl /themes/dracula/login/error.ftl &&
              cp /theme-source/login-verify-email.ftl /themes/dracula/login/login-verify-email.ftl
          volumeMounts:
            - name: themes
              mountPath: /themes
            - name: theme-source
              mountPath: /theme-source
      containers:
        - name: keycloak
          image: {{ .Values.thirdPartyImages.keycloak }}
          args: ["start", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: KEYCLOAK_ADMIN
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak_db
            - name: KC_DB_USERNAME
              value: testcraft_keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: POSTGRES_KEYCLOAK_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: JAVA_OPTS_APPEND
              value: "-Xms512m -Xmx1024m"
          ports:
            - containerPort: 8080
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              memory: 768Mi
              cpu: "250m"
            limits:
              memory: 1.5Gi
              cpu: "1"
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: themes
              mountPath: /opt/keycloak/themes
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-data
        - name: realm-source
          configMap:
            name: realm
        - name: themes
          emptyDir: {}
        - name: theme-source
          configMap:
            name: keycloak-dracula-theme
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
