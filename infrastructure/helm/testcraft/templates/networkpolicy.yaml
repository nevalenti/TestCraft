{{/*
Least-privilege ingress NetworkPolicies, one per workload, grouped by tier.
Each pod may only be reached by the specific pods that actually call it (per
apps/Gateway's ReverseProxy config, prometheus.yml's scrape_configs, and the
env vars/connection strings each service is given). Egress is intentionally
left unrestricted: several services (keycloak OAuth providers, SMTP,
cert-manager ACME, offsite backup) need to reach the internet, and locking
that down blind, without a cluster to verify against, risks silently
breaking them.

Caveat: kubelet liveness/readiness probes originate from the node, not from
a pod that these policies can select as a source. Mainstream CNIs (Calico,
Cilium, most managed K8s) don't route node-to-pod probe traffic through
NetworkPolicy enforcement, but this is CNI-dependent — verify probes still
pass in a non-prod environment before relying on this in production.
*/}}

{{/* ---- public edge ---- */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes: [Ingress]
  ingress:
    - {} # public entrypoint (LoadBalancer) — reachable from anywhere
---
{{/* ---- application tier: only the gateway may reach these ---- */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docs
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: docs
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
        - podSelector: {matchLabels: {app: api}}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: glitchtip-web
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: glitchtip-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
      ports: [{port: 8000, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
      ports: [{port: 3000, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seq
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: seq
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}} # web UI (reverse-proxied) + gateway's own log shipping
        - podSelector: {matchLabels: {app: api}} # api's own log shipping
      ports: [{port: 80, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}} # /storage route
        - podSelector: {matchLabels: {app: api}}
        - podSelector: {matchLabels: {app: minio-backup}}
        - podSelector: {matchLabels: {app: postgres-backup}}
        - podSelector: {matchLabels: {app: postgres-restore-verify}}
        - podSelector: {matchLabels: {app: offsite-backup-sync}}
      ports: [{port: 9000, protocol: TCP}, {port: 9001, protocol: TCP}]

{{/* ---- data tier: only the specific consumers below may reach these ---- */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
        - podSelector: {matchLabels: {app: migrator}}
        - podSelector: {matchLabels: {app: keycloak}}
        - podSelector: {matchLabels: {app: glitchtip-migrate}}
        - podSelector: {matchLabels: {app: glitchtip-web}}
        - podSelector: {matchLabels: {app: glitchtip-worker}}
        - podSelector: {matchLabels: {app: postgres-exporter}}
        - podSelector: {matchLabels: {app: postgres-backup}}
        - podSelector: {matchLabels: {app: postgres-restore-verify}}
      ports: [{port: 5432, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
        - podSelector: {matchLabels: {app: glitchtip-web}}
        - podSelector: {matchLabels: {app: glitchtip-worker}}
        - podSelector: {matchLabels: {app: redis-exporter}}
      ports: [{port: 6379, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
      ports: [{port: 5672, protocol: TCP}]
    - from:
        - podSelector: {matchLabels: {app: rabbitmq-exporter}}
      ports: [{port: 15672, protocol: TCP}]

{{/* ---- observability tier ---- */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
        - podSelector: {matchLabels: {app: gateway}}
        - podSelector: {matchLabels: {app: grafana}}
      ports: [{port: 3100, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
        - podSelector: {matchLabels: {app: gateway}}
      ports: [{port: 4317, protocol: TCP}, {port: 4318, protocol: TCP}]
    - from:
        - podSelector: {matchLabels: {app: grafana}}
      ports: [{port: 3200, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: grafana}}
      ports: [{port: 9090, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
        - podSelector: {matchLabels: {app: grafana}}
      ports: [{port: 9093, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-exporter
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres-exporter
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{port: 9187, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-exporter
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: redis-exporter
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{port: 9121, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-exporter
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: rabbitmq-exporter
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{port: 9419, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: kube-state-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{port: 8080, protocol: TCP}]
---
{{/* node-exporter uses hostNetwork; NetworkPolicy generally can't govern
     hostNetwork pod traffic (it bypasses the pod network entirely), so this
     is a compliance no-op kept for scanner coverage, not real enforcement. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: node-exporter
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{port: 9100, protocol: TCP}]

{{/* ---- batch jobs and workers: nothing calls these, so deny all ingress ---- */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: batch-jobs
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - migrator
          - glitchtip-migrate
          - glitchtip-worker
          - postgres-backup
          - minio-backup
          - postgres-restore-verify
  policyTypes: [Ingress]
  ingress: []
{{- if .Values.backups.offsite.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offsite-backup-sync
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: offsite-backup-sync
  policyTypes: [Ingress]
  ingress: []
{{- end }}
