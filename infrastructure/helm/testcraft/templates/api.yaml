apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: testcraft_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: POSTGRES_APP_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: RABBITMQ_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672"
            - name: KEYCLOAK_AUTHORITY
              value: http://keycloak:8080/realms/testcraft
            - name: KEYCLOAK_ISSUER
              value: https://auth.testcraft.pro/realms/testcraft
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: testcraft-api
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            - name: KEYCLOAK_AUDIENCE
              value: testcraft-web
            - name: KEYCLOAK_REQUIRE_HTTPS_METADATA
              value: "false"
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: CORS_ALLOWED_ORIGINS
            - name: LOKI_URL
              value: http://loki:3100
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo:4317
            - name: SEQ_URL
              value: http://seq
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: METRICS_TOKEN
                  optional: true
            - name: SWAGGER_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: SWAGGER_BASIC_AUTH_USERNAME
                  optional: true
            - name: SWAGGER_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: SWAGGER_BASIC_AUTH_PASSWORD
                  optional: true
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BUCKET
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: MINIO_BUCKET
                  optional: true
            - name: MINIO_PUBLIC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: MINIO_PUBLIC_ENDPOINT
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: SMTP_PASSWORD
                  optional: true
            - name: SMTP_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: SMTP_FROM_ADDRESS
                  optional: true
            - name: APPLY_MIGRATIONS
              value: "true"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
              cpu: "100m"
            limits:
              memory: 512Mi
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
