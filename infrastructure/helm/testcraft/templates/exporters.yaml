apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-exporter
          image: {{ .Values.thirdPartyImages.postgres_exporter }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: POSTGRES_MONITOR_PASSWORD
            - name: DATA_SOURCE_NAME
              value: "postgresql://testcraft_monitor:$(POSTGRES_MONITOR_PASSWORD)@postgres:5432/postgres?sslmode=disable"
          ports:
            - containerPort: 9187
          resources:
            requests:
              memory: 32Mi
              cpu: "50m"
            limits:
              memory: 64Mi
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres-exporter
  ports:
    - port: 9187
      targetPort: 9187
---
