apiVersion: v1
kind: Secret
metadata:
  name: testcraft-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  POSTGRES_APP_PASSWORD: {{ .Values.secrets.postgresAppPassword | quote }}
  POSTGRES_KEYCLOAK_PASSWORD: {{ .Values.secrets.postgresKeycloakPassword | quote }}
  POSTGRES_MONITOR_PASSWORD: {{ .Values.secrets.postgresMonitorPassword | quote }}
  RABBITMQ_USER: {{ .Values.secrets.rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.secrets.corsAllowedOrigins | quote }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  SWAGGER_BASIC_AUTH_USERNAME: {{ .Values.secrets.swaggerBasicAuthUsername | quote }}
  SWAGGER_BASIC_AUTH_PASSWORD: {{ .Values.secrets.swaggerBasicAuthPassword | quote }}
  HANGFIRE_BASIC_AUTH_USERNAME: {{ .Values.secrets.hangfireBasicAuthUsername | quote }}
  HANGFIRE_BASIC_AUTH_PASSWORD: {{ .Values.secrets.hangfireBasicAuthPassword | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
  OFFSITE_BACKUP_ACCESS_KEY: {{ .Values.secrets.offsiteBackupAccessKey | quote }}
  OFFSITE_BACKUP_SECRET_KEY: {{ .Values.secrets.offsiteBackupSecretKey | quote }}
  MINIO_BUCKET: {{ .Values.secrets.minioBucket | quote }}
  MINIO_PUBLIC_ENDPOINT: {{ .Values.secrets.minioPublicEndpoint | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
  SEQ_ADMIN_PASSWORD: {{ .Values.secrets.seqAdminPassword | quote }}
  KEYCLOAK_ADMIN: {{ .Values.secrets.keycloakAdmin | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.keycloakAdminPassword | quote }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ .Values.secrets.keycloakAdminClientSecret | quote }}
  TESTCRAFT_CI_CLIENT_SECRET: {{ .Values.secrets.testcraftCiClientSecret | quote }}
  GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  SMTP_HOST: {{ .Values.secrets.smtpHost | quote }}
  SMTP_PORT: {{ .Values.secrets.smtpPort | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  SMTP_FROM_ADDRESS: {{ .Values.secrets.smtpFromAddress | quote }}
