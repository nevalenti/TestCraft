apiVersion: v1
kind: Secret
metadata:
  name: testcraft-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  POSTGRES_EXPORTER_DSN: {{ .Values.secrets.postgresExporterDsn | quote }}
  RABBITMQ_USER: {{ .Values.secrets.rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.secrets.corsAllowedOrigins | quote }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  SWAGGER_BASIC_AUTH_USERNAME: {{ .Values.secrets.swaggerBasicAuthUsername | quote }}
  SWAGGER_BASIC_AUTH_PASSWORD: {{ .Values.secrets.swaggerBasicAuthPassword | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
  MINIO_BUCKET: {{ .Values.secrets.minioBucket | quote }}
  MINIO_PUBLIC_ENDPOINT: {{ .Values.secrets.minioPublicEndpoint | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
  KEYCLOAK_ADMIN: {{ .Values.secrets.keycloakAdmin | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.keycloakAdminPassword | quote }}
  GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
