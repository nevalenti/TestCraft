{{- if eq .Values.tls.provider "letsencrypt" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: testcraft-letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.tls.acmeEmail | required "tls.acmeEmail is required when tls.provider is letsencrypt" | quote }}
    privateKeySecretRef:
      name: testcraft-letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx-acme
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testcraft-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: testcraft-tls
  issuerRef:
    name: testcraft-letsencrypt
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.tls.dnsNames }}
    - {{ . | quote }}
    {{- end }}
{{- else }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: testcraft-ca-issuer
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: testcraft-ca-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testcraft-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: testcraft-tls
  issuerRef:
    name: testcraft-ca-issuer
    kind: Issuer
  {{- if .Values.tls.dnsNames }}
  dnsNames:
    {{- range .Values.tls.dnsNames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- if .Values.tls.ipAddresses }}
  ipAddresses:
    {{- range .Values.tls.ipAddresses }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  duration: 8760h
  renewBefore: 720h
{{- end }}
