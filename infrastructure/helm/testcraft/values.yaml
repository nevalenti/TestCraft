images:
  api:
    repository: testcraft-api
    tag: latest
    pullPolicy: IfNotPresent
  web:
    repository: testcraft-web
    tag: latest
    pullPolicy: IfNotPresent
  gateway:
    repository: testcraft-gateway
    tag: latest
    pullPolicy: IfNotPresent
  docs:
    repository: testcraft-docs
    tag: latest
    pullPolicy: IfNotPresent

thirdPartyImages:
  postgres: postgres:16-alpine
  redis: redis:7-alpine
  rabbitmq: rabbitmq:4-management-alpine
  minio: minio/minio:latest
  minio_client: minio/mc:latest
  keycloak: quay.io/keycloak/keycloak:26.2
  busybox: busybox:1.36
  grafana: grafana/grafana:11.6.0
  loki: grafana/loki:3.4.3
  tempo: grafana/tempo:2.7.1
  prometheus: prom/prometheus:v3.4.0
  alertmanager: prom/alertmanager:v0.27.0
  seq: datalust/seq:2024.3
  postgres_exporter: prometheuscommunity/postgres-exporter:v0.17.1
  redis_exporter: oliver006/redis_exporter:v1.67.0
  rabbitmq_exporter: kbudde/rabbitmq-exporter:v0.29.0
  kube_state_metrics: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
  node_exporter: prom/node-exporter:v1.8.2

tls:
  provider: mkcert
  acmeEmail: ""
  dnsNames:
    - testcraft.pro
    - auth.testcraft.pro

ingress-nginx:
  enabled: false

keycloak:
  hostname: https://auth.testcraft.pro

storage:
  postgres: 5Gi
  rabbitmq: 1Gi
  loki: 5Gi
  seq: 5Gi
  prometheus: 10Gi
  alertmanager: 1Gi
  grafana: 1Gi
  keycloak: 1Gi
  minio: 10Gi
  tempo: 5Gi

backups:
  postgresSchedule: "0 3 * * *"
  minioSchedule: "15 3 * * *"
  restoreVerifySchedule: "30 3 * * *"
  minioBucket: testcraft-backups
  retentionDays: 14

secrets:
  postgresUser: ""
  postgresPassword: ""
  postgresDb: ""
  postgresAppPassword: ""
  postgresKeycloakPassword: ""
  postgresMonitorPassword: ""
  rabbitmqUser: ""
  rabbitmqPassword: ""
  redisPassword: ""
  corsAllowedOrigins: ""
  metricsToken: ""
  swaggerBasicAuthUsername: ""
  swaggerBasicAuthPassword: ""
  minioRootUser: ""
  minioRootPassword: ""
  minioBucket: ""
  minioPublicEndpoint: ""
  grafanaAdminPassword: ""
  seqAdminPassword: ""
  keycloakAdmin: ""
  keycloakAdminPassword: ""
  keycloakAdminClientSecret: ""
  githubClientId: ""
  githubClientSecret: ""
  googleClientId: ""
  googleClientSecret: ""
  smtpHost: ""
  smtpPort: ""
  smtpUser: ""
  smtpPassword: ""
  smtpFromAddress: ""
  alertEmailTo: ""
