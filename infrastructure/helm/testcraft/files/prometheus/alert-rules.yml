groups:
  - name: testcraft.api.rules
    rules:
      - record: testcraft:api_error_ratio:rate5m
        expr: sum(rate(http_requests_received_total{job="testcraft-api", code=~"5.."}[5m])) / sum(rate(http_requests_received_total{job="testcraft-api"}[5m]))
      - record: testcraft:api_error_ratio:rate30m
        expr: sum(rate(http_requests_received_total{job="testcraft-api", code=~"5.."}[30m])) / sum(rate(http_requests_received_total{job="testcraft-api"}[30m]))
      - record: testcraft:api_error_ratio:rate1h
        expr: sum(rate(http_requests_received_total{job="testcraft-api", code=~"5.."}[1h])) / sum(rate(http_requests_received_total{job="testcraft-api"}[1h]))
      - record: testcraft:api_error_ratio:rate6h
        expr: sum(rate(http_requests_received_total{job="testcraft-api", code=~"5.."}[6h])) / sum(rate(http_requests_received_total{job="testcraft-api"}[6h]))

      - alert: ApiErrorBudgetFastBurn
        expr: |
          testcraft:api_error_ratio:rate1h > (14.4 * 0.005)
          and testcraft:api_error_ratio:rate5m > (14.4 * 0.005)
          and sum(increase(http_requests_received_total{job="testcraft-api"}[1h])) > 30
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API is burning its error budget fast"
          description: "{{ $value | humanizePercentage }} of testcraft-api requests returned a 5xx over the last hour (budget: 0.5%) - at least 14x the rate the monthly budget can sustain."
          dashboard_url: https://testcraft.pro/grafana/d/testcraft-overview
          runbook_url: https://testcraft.pro/docs/runbooks/alerts/#apierrorbudgetfastburn

      - alert: ApiErrorBudgetSlowBurn
        expr: |
          testcraft:api_error_ratio:rate6h > (6 * 0.005)
          and testcraft:api_error_ratio:rate30m > (6 * 0.005)
          and sum(increase(http_requests_received_total{job="testcraft-api"}[6h])) > 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API is steadily burning its error budget"
          description: "{{ $value | humanizePercentage }} of testcraft-api requests returned a 5xx over the last 6 hours (budget: 0.5%)."
          dashboard_url: https://testcraft.pro/grafana/d/testcraft-overview
          runbook_url: https://testcraft.pro/docs/runbooks/alerts/#apierrorbudgetslowburn

      - alert: ApiHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="testcraft-api"}[5m])))
          > 1
          and sum(rate(http_request_duration_seconds_count{job="testcraft-api"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 1s"
          description: "p95 request latency for testcraft-api has been above 1 second for 10 minutes: {{ $value }}s."
          dashboard_url: https://testcraft.pro/grafana/d/testcraft-overview
          runbook_url: https://testcraft.pro/docs/runbooks/alerts/#apihighlatencyp95

      - alert: ApiThreadPoolStarved
        expr: max by (instance) (system_runtime_dotnet_thread_pool_queue_length{job="testcraft-api"}) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API thread pool on {{ $labels.instance }} is starved"
          description: "{{ $value }} work items have been waiting for a thread-pool thread on {{ $labels.instance }} for 10 minutes. Something is blocking threads (sync-over-async, a slow lock), stalling every request on that pod."
          dashboard_url: https://testcraft.pro/grafana/d/testcraft-overview
          runbook_url: https://testcraft.pro/docs/runbooks/alerts/#apithreadpoolstarved

      - alert: ApiMemoryGrowing
        expr: |
          deriv(process_working_set_bytes{job="testcraft-api"}[6h]) * 3600 > 20 * 1024 * 1024
          and process_working_set_bytes{job="testcraft-api"} > 256 * 1024 * 1024
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "API memory on {{ $labels.instance }} keeps growing"
          description: "The working set on {{ $labels.instance }} has grown by {{ $value | humanize1024 }}B/h for the last 6 hours and is above 256MiB (the limit is 512MiB)."
          dashboard_url: https://testcraft.pro/grafana/d/testcraft-overview
          runbook_url: https://testcraft.pro/docs/runbooks/alerts/#apimemorygrowing

      - alert: ApiRequestsPilingUp
        expr: sum by (instance) (http_requests_in_progress{job="testcraft-api"}) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Requests are piling up on {{ $labels.instance }}"
          description: "{{ $value }} requests have been in flight on {{ $labels.instance }} for 5 minutes - the API is not keeping up (slow database, starved thread pool, or a slow dependency)."
          dashboard_url: https://testcraft.pro/grafana/d/testcraft-overview
          runbook_url: https://testcraft.pro/docs/runbooks/alerts/#apirequestspilingup

      - alert: ApiRateLimitRejectionsHigh
        expr: sum by (limit) (rate(testcraft_rate_limited_requests_total{job="testcraft-api"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API is rejecting a sustained volume of requests via the {{ $labels.limit }} rate limit"
          description: "testcraft-api has rejected requests on the {{ $labels.limit }} rate limit at {{ $value | printf \"%.2f\" }}/s for 10 minutes - check for an abusive client or an undersized rate limit."
          dashboard_url: https://testcraft.pro/grafana/d/testcraft-overview
          runbook_url: https://testcraft.pro/docs/runbooks/alerts/#apiratelimitrejectionshigh

      - alert: NotificationDeliveryAbandoned
        expr: sum by (channel) (increase(notification_deliveries_abandoned_total{job="testcraft-api"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Notification deliveries are being abandoned on {{ $labels.channel }}"
          description: "{{ $value }} {{ $labels.channel }} notification deliveries were abandoned after exhausting retries in the last 15 minutes. Check the target endpoint/SMTP relay for outages."
          dashboard_url: https://testcraft.pro/grafana/d/testcraft-overview
          runbook_url: https://testcraft.pro/docs/runbooks/alerts/#notificationdeliveryabandoned

      - alert: HangfireJobFailed
        expr: sum by (job_name) (increase(hangfire_jobs_failed_total{job="testcraft-api"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Hangfire job {{ $labels.job_name }} failed"
          description: "{{ $labels.job_name }} has failed {{ $value }} time(s) in the last 15 minutes. The exception is on the /hangfire dashboard; logs in Grafana (service_name=testcraft-api)."
          dashboard_url: https://testcraft.pro/grafana/d/testcraft-overview
          runbook_url: https://testcraft.pro/docs/runbooks/alerts/#hangfirejobfailed

  - name: testcraft.rules
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.job }} ({{ $labels.instance }}) for 5 minutes."

      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas{namespace="testcraft"} != kube_deployment_status_replicas_available{namespace="testcraft"}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} is under-replicated"
          description: "{{ $labels.deployment }} has had fewer available replicas than desired for 10 minutes."

      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace="testcraft"}[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted more than 3 times in the last 15 minutes."

      - alert: NodeDiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"} < 0.1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Node root filesystem below 10% free space"
          description: "Only {{ $value | humanizePercentage }} of the root filesystem is free on {{ $labels.instance }}."

      - alert: NodeMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Node available memory below 10%"
          description: "{{ $labels.instance }} has less than 10% memory available."

      - alert: PersistentVolumeAlmostFull
        expr: kubelet_volume_stats_used_bytes{namespace="testcraft"} / kubelet_volume_stats_capacity_bytes{namespace="testcraft"} > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.persistentvolumeclaim }} is over 85% full"
          description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is at {{ $value | humanizePercentage }} capacity."

      - alert: BackupJobFailed
        expr: kube_job_status_failed{namespace="testcraft", job_name=~"postgres-backup-.*|minio-backup-.*"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backup job {{ $labels.job_name }} failed"
          description: "Kubernetes Job {{ $labels.job_name }} reported a failure. Check its pod logs for details."

      - alert: BackupRestoreVerifyFailed
        expr: kube_job_status_failed{namespace="testcraft", job_name=~"postgres-restore-verify-.*"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backup restore verification failed"
          description: "postgres-restore-verify could not restore the latest backup dump into a scratch database, or the restored data looked empty. The backup job succeeding is not enough on its own - check its pod logs, the dump may be unusable."

      - alert: PostgresBackupMissing
        expr: time() - max(kube_job_status_completion_time{namespace="testcraft", job_name=~"postgres-backup-.*"}) > 93600
        labels:
          severity: critical
        annotations:
          summary: "No successful Postgres backup in over 26 hours"
          description: "The postgres-backup CronJob has not completed successfully recently. Check whether it is still scheduled and running."

      - alert: MinioBackupMissing
        expr: time() - max(kube_job_status_completion_time{namespace="testcraft", job_name=~"minio-backup-.*"}) > 93600
        labels:
          severity: critical
        annotations:
          summary: "No successful MinIO backup in over 26 hours"
          description: "The minio-backup CronJob has not completed successfully recently. Check whether it is still scheduled and running."

      - alert: BackupRestoreVerifyMissing
        expr: time() - max(kube_job_status_completion_time{namespace="testcraft", job_name=~"postgres-restore-verify-.*"}) > 93600
        labels:
          severity: critical
        annotations:
          summary: "No successful backup restore verification in over 26 hours"
          description: "The postgres-restore-verify CronJob has not completed successfully recently. Check whether it is still scheduled and running."
