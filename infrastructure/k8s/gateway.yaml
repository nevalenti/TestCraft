apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: testcraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: testcraft-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
            - containerPort: 443
            - containerPort: 8443
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: "100m"
            limits:
              memory: 256Mi
              cpu: "500m"
          volumeMounts:
            - name: tls
              mountPath: /etc/gateway/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: testcraft-tls
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: testcraft
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: keycloak-https
      port: 8443
      targetPort: 8443
