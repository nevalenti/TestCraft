version: 2
updates:
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/apps/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/apps/Api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/apps/Gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/apps/docs"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    cooldown:
      default-days: 7
    directory: "/apps/Api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    cooldown:
      default-days: 7
    directory: "/apps/Gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
