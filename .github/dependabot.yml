version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'

  - package-ecosystem: 'docker'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker'
    directory: '/apps/Api'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker'
    directory: '/apps/Gateway'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker'
    directory: '/apps/docs'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'nuget'
    directory: '/apps/Api'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'nuget'
    directory: '/apps/Gateway'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
