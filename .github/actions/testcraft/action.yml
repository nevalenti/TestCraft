name: Import results to TestCraft
description: Authenticates with Keycloak and uploads a JUnit XML report to TestCraft

inputs:
  command:
    description: "'start' creates an Active run before tests; 'import' (default) imports results after tests"
    required: false
    default: import
  token:
    description: TestCraft API token — when set, authenticates with this instead of username/password and requires project-id instead of project-name
    required: false
  username:
    description: TestCraft service account username — required when token is not set
    required: false
  password:
    description: TestCraft service account password — required when token is not set
    required: false
  api-url:
    description: TestCraft API base URL — when empty the step is a no-op
    required: false
  project-id:
    description: TestCraft project ID to import results into — required when token is set
    required: false
  project-name:
    description: TestCraft project name to import results into — required when token is not set
    required: false
  junit-xml:
    description: Path to the JUnit XML report file, or a single-directory glob (e.g. "dir/*.junit.xml") to merge multiple reports — required when command is import
    required: false
  run-name:
    description: Display name for the imported test run
    required: true
  keycloak-authority:
    description: Public Keycloak authority URL — when set, skips fetching from api-url/api/auth-config
    required: false
  source:
    description: Source tag for test suites (e.g. api, web, e2e)
    required: false
  screenshots-dir:
    description: Path to Playwright test-results directory — when set, PNG screenshots are uploaded as attachments to failed results
    required: false

outputs:
  run-id:
    description: ID of the TestCraft run that was created or updated

runs:
  using: node20
  main: dist/index.js
