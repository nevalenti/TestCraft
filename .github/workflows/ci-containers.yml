name: ci-containers

on:
  push:
    branches: [main]
    paths:
      [
        "apps/Api/**",
        "apps/web/**",
        "apps/Gateway/**",
        "packages/types/**",
        "pnpm-*.yaml",
        "package.json",
        "Directory.*",
        "compose.smoke.yaml",
        "scripts/container-smoke.sh",
        ".github/workflows/ci-containers.yml",
      ]
  pull_request:
    paths:
      [
        "apps/Api/**",
        "apps/web/**",
        "apps/Gateway/**",
        "packages/types/**",
        "pnpm-*.yaml",
        "package.json",
        "Directory.*",
        "compose.smoke.yaml",
        "scripts/container-smoke.sh",
        ".github/workflows/ci-containers.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: bash scripts/container-smoke.sh
