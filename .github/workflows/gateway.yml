name: gateway

on:
  push:
    branches: [main]
    paths:
      - "apps/Gateway/**"
      - ".github/workflows/gateway.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/Gateway/**"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        shell: sh
        run: |
          wget -qO /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint --ignore DL3018 --ignore DL3059 apps/Gateway/Dockerfile

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'apps/Gateway/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TestCraft.slnx

      - name: Format check
        run: dotnet csharpier check apps/Gateway

      - name: Build
        run: dotnet build apps/Gateway/src/TestCraft.Gateway/TestCraft.Gateway.csproj apps/Gateway/tests/TestCraft.Gateway.Tests/TestCraft.Gateway.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test apps/Gateway/tests/TestCraft.Gateway.Tests/TestCraft.Gateway.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --settings apps/Gateway/coverlet.runsettings
