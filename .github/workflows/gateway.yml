name: gateway

on:
  push:
    branches: [main]
    paths:
      - 'apps/Gateway/**'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/Gateway/**'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/testcraft-gateway

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Dockerfile
        shell: sh
        run: |
          wget -qO /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint --ignore DL3018 --ignore DL3059 apps/Gateway/Dockerfile

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'apps/Gateway/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TestCraft.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Format check
        run: dotnet csharpier check apps/Gateway

      - name: Build
        run: |
          dotnet build apps/Gateway/src/TestCraft.Gateway/TestCraft.Gateway.csproj --no-restore --configuration Release
          dotnet build apps/Gateway/tests/TestCraft.Gateway.Tests/TestCraft.Gateway.Tests.csproj --no-restore --configuration Release

      - name: Start TestCraft run
        id: testcraft-start
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft
        with:
          command: start
          username: ${{ secrets.TESTCRAFT_USERNAME }}
          password: ${{ secrets.TESTCRAFT_PASSWORD }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          keycloak-authority: ${{ secrets.TESTCRAFT_KEYCLOAK_AUTHORITY }}
          project-name: TestCraft
          run-name: '#${{ github.run_id }} gateway (${{ github.ref_name }})'
          source: gateway

      - name: Test
        run: dotnet test apps/Gateway/tests/TestCraft.Gateway.Tests/TestCraft.Gateway.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --settings apps/Gateway/coverlet.runsettings
        env:
          TESTCRAFT_RUN_ID: ${{ steps.testcraft-start.outputs.run-id }}
          TESTCRAFT_API_URL: ${{ secrets.TESTCRAFT_API_URL }}
          TESTCRAFT_KEYCLOAK_AUTHORITY: ${{ secrets.TESTCRAFT_KEYCLOAK_AUTHORITY }}
          TESTCRAFT_USERNAME: ${{ secrets.TESTCRAFT_USERNAME }}
          TESTCRAFT_PASSWORD: ${{ secrets.TESTCRAFT_PASSWORD }}
          TESTCRAFT_PROJECT_NAME: TestCraft
          TESTCRAFT_SOURCE: gateway

      - name: Import results to TestCraft
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft
        with:
          username: ${{ secrets.TESTCRAFT_USERNAME }}
          password: ${{ secrets.TESTCRAFT_PASSWORD }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          keycloak-authority: ${{ secrets.TESTCRAFT_KEYCLOAK_AUTHORITY }}
          project-name: TestCraft
          junit-xml: apps/Gateway/test-results/*.junit.xml
          run-name: '#${{ github.run_id }} gateway (${{ github.ref_name }})'
          source: gateway

  docker:
    name: docker build & push
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/Gateway/Dockerfile
          load: true
          tags: gateway-scan:${{ github.sha }}
          cache-from: type=gha,scope=gateway

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gateway-scan:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload scan results to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: trivy-results.sarif

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/Gateway/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          provenance: false

  deploy:
    name: deploy to production
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, testcraft-production]
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Restore production secrets
        run: |
          secrets_file=/home/deploy/repos/TestCraft/infrastructure/helm/testcraft/values.secrets.yaml
          test -f "$secrets_file" || { echo "::error::production secrets file missing at $secrets_file"; exit 1; }
          cp "$secrets_file" infrastructure/helm/testcraft/values.secrets.yaml

      - name: Deploy gateway
        run: make deploy-app APP=gateway TAG=sha-${{ github.sha }}
