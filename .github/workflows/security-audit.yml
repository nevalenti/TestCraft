name: security-audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  nuget:
    name: audit NuGet packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TestCraft.slnx

      - name: List vulnerable packages
        run: |
          dotnet list TestCraft.slnx package --vulnerable --include-transitive > vulnerable-packages.log 2>&1
          cat vulnerable-packages.log
          if grep -q "has the following vulnerable packages" vulnerable-packages.log; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

  pnpm:
    name: audit pnpm packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
