name: e2e

on:
  push:
    branches: [main]
    paths:
      - 'apps/Api/**'
      - 'apps/web/**'
      - 'Common/**'
      - 'e2e/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'infrastructure/keycloak/e2e.env'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/Api/**'
      - 'apps/web/**'
      - 'Common/**'
      - 'e2e/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'infrastructure/keycloak/e2e.env'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: testcraft_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load shared e2e config
        run: grep -v '^#' infrastructure/keycloak/e2e.env | grep -v '^$' >> "$GITHUB_ENV"

      - name: Render dev realm.json
        run: scripts/render-dev-realm.sh

      - name: Start Keycloak
        run: |
          docker run -d \
            --rm \
            --name keycloak \
            --network host \
            -e KC_HEALTH_ENABLED=true \
            -v ${{ github.workspace }}/infrastructure/helm/testcraft/files/keycloak/theme/theme.properties:/opt/keycloak/themes/dracula/login/theme.properties:ro \
            -v ${{ github.workspace }}/infrastructure/helm/testcraft/files/keycloak/theme/template.ftl:/opt/keycloak/themes/dracula/login/template.ftl:ro \
            -v ${{ github.workspace }}/infrastructure/helm/testcraft/files/keycloak/theme/login.ftl:/opt/keycloak/themes/dracula/login/login.ftl:ro \
            -v ${{ github.workspace }}/infrastructure/helm/testcraft/files/keycloak/theme/register.ftl:/opt/keycloak/themes/dracula/login/register.ftl:ro \
            -v ${{ github.workspace }}/infrastructure/helm/testcraft/files/keycloak/theme/error.ftl:/opt/keycloak/themes/dracula/login/error.ftl:ro \
            -v ${{ github.workspace }}/infrastructure/helm/testcraft/files/keycloak/theme/login-verify-email.ftl:/opt/keycloak/themes/dracula/login/login-verify-email.ftl:ro \
            -v ${{ github.workspace }}/infrastructure/keycloak/realm.json:/realm-source/realm.json:ro \
            --entrypoint /bin/sh \
            quay.io/keycloak/keycloak:26.2 \
            -c 'mkdir -p /opt/keycloak/data/import && sed "s|\"GITHUB_IDP_ENABLED\"|false|g; s|\"GOOGLE_IDP_ENABLED\"|false|g" /realm-source/realm.json > /opt/keycloak/data/import/realm.json && exec /opt/keycloak/bin/kc.sh start-dev --import-realm'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore apps/Api/src/TestCraft.Api/TestCraft.Api.csproj

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @testcraft/types run build

      - name: Install Playwright browsers
        run: pnpm --filter testcraft-e2e exec playwright install chromium --with-deps

      - name: Wait for Keycloak
        run: timeout 120 sh -c 'until curl -sf http://localhost:9000/health/ready > /dev/null 2>&1; do sleep 3; done'

      - name: Start TestCraft run
        id: testcraft-start
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft
        with:
          command: start
          username: ${{ secrets.TESTCRAFT_USERNAME }}
          password: ${{ secrets.TESTCRAFT_PASSWORD }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          keycloak-authority: ${{ secrets.TESTCRAFT_KEYCLOAK_AUTHORITY }}
          project-name: TestCraft
          run-name: '#${{ github.run_id }} e2e (${{ github.ref_name }})'
          source: e2e

      - name: Run e2e tests
        run: pnpm --filter testcraft-e2e run e2e
        env:
          DATABASE_URL: postgresql://e2e:e2e@localhost:5433/testcraft_e2e
          KEYCLOAK_AUTHORITY: http://localhost:8080/realms/testcraft
          VITE_KEYCLOAK_URL: http://localhost:8080
          TESTCRAFT_RUN_ID: ${{ steps.testcraft-start.outputs.run-id }}
          TESTCRAFT_API_URL: ${{ secrets.TESTCRAFT_API_URL }}
          TESTCRAFT_KEYCLOAK_AUTHORITY: ${{ secrets.TESTCRAFT_KEYCLOAK_AUTHORITY }}
          TESTCRAFT_USERNAME: ${{ secrets.TESTCRAFT_USERNAME }}
          TESTCRAFT_PASSWORD: ${{ secrets.TESTCRAFT_PASSWORD }}

      - name: Import results to TestCraft
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft
        with:
          username: ${{ secrets.TESTCRAFT_USERNAME }}
          password: ${{ secrets.TESTCRAFT_PASSWORD }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          keycloak-authority: ${{ secrets.TESTCRAFT_KEYCLOAK_AUTHORITY }}
          project-name: TestCraft
          junit-xml: e2e/e2e-results/junit.xml
          run-name: '#${{ github.run_id }} e2e (${{ github.ref_name }})'
          source: e2e
          screenshots-dir: e2e/test-results

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/e2e-results
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7
