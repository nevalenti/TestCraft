name: e2e

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/e2e/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/e2e/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: testcraft_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Keycloak
        run: |
          docker run -d \
            --rm \
            --name keycloak \
            --network host \
            -e KC_HEALTH_ENABLED=true \
            -v ${{ github.workspace }}/apps/e2e/keycloak-realm.json:/opt/keycloak/data/import/realm.json \
            quay.io/keycloak/keycloak:26.2 \
            start-dev --import-realm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @testcraft/types run build

      - name: Install Playwright browsers
        run: pnpm --filter testcraft-e2e exec playwright install chromium --with-deps

      - name: Generate Prisma client
        run: pnpm --filter testcraft-api run db:generate

      - name: Migrate database
        run: pnpm --filter testcraft-api run db:migrate
        env:
          DATABASE_URL: postgresql://e2e:e2e@localhost:5432/testcraft_e2e

      - name: Wait for Keycloak
        run: timeout 120 sh -c 'until curl -sf http://localhost:9000/health/ready > /dev/null 2>&1; do sleep 3; done'

      - name: Run e2e tests
        run: pnpm --filter testcraft-e2e run e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_USERNAME: e2e@testcraft.dev
          E2E_PASSWORD: e2e
          DATABASE_URL: postgresql://e2e:e2e@localhost:5432/testcraft_e2e
          KEYCLOAK_AUTHORITY: http://localhost:8080/realms/testcraft
          KEYCLOAK_AUDIENCE: testcraft-web
          KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          VITE_API_URL: http://localhost:5000
          VITE_KEYCLOAK_URL: http://localhost:8080
          VITE_KEYCLOAK_REALM: testcraft
          VITE_KEYCLOAK_CLIENT_ID: testcraft-web

      - name: Import results to TestCraft
        if: always()
        continue-on-error: true
        uses: ./.github/actions/import-results
        with:
          keycloak-authority: ${{ secrets.TESTCRAFT_KEYCLOAK_AUTHORITY }}
          username: ${{ secrets.TESTCRAFT_USERNAME }}
          password: ${{ secrets.TESTCRAFT_PASSWORD }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          project-id: ${{ secrets.TESTCRAFT_E2E_PROJECT_ID }}
          junit-xml: apps/e2e/e2e-results/junit.xml
          run-name: "#${{ github.run_id }} e2e (${{ github.ref_name }})"

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/e2e-results
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/e2e/test-results
          retention-days: 7
