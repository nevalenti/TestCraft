name: checkov

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/helm/**'
      - '**/Dockerfile*'
      - '.checkov.baseline'
      - '.github/workflows/checkov.yml'
  pull_request:
    paths:
      - 'infrastructure/helm/**'
      - '**/Dockerfile*'
      - '.checkov.baseline'
      - '.github/workflows/checkov.yml'
  workflow_dispatch:

concurrency:
  group: checkov-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: iac security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov==3.3.11

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.16.4'

      - name: Helm dependency update
        run: helm dependency update infrastructure/helm/testcraft

      - name: Scan Helm chart
        if: github.event_name == 'pull_request'
        run: |
          checkov -d infrastructure/helm/testcraft --framework helm \
            --baseline infrastructure/helm/testcraft/.checkov.baseline \
            -o cli -o sarif --output-file-path console,checkov-helm.sarif

      - name: Scan Helm chart (report only)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          checkov -d infrastructure/helm/testcraft --framework helm \
            --baseline infrastructure/helm/testcraft/.checkov.baseline \
            -o cli -o sarif --output-file-path console,checkov-helm.sarif

      - name: Scan Dockerfiles
        if: github.event_name == 'pull_request'
        run: |
          checkov -d . --framework dockerfile \
            --baseline .checkov.baseline \
            -o cli -o sarif --output-file-path console,checkov-dockerfile.sarif

      - name: Scan Dockerfiles (report only)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          checkov -d . --framework dockerfile \
            --baseline .checkov.baseline \
            -o cli -o sarif --output-file-path console,checkov-dockerfile.sarif

      - name: Upload Helm results to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: checkov-helm.sarif
          category: checkov-helm

      - name: Upload Dockerfile results to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: checkov-dockerfile.sarif
          category: checkov-dockerfile
