name: api

on:
  push:
    branches: [main]
    paths:
      - 'apps/Api/**'
      - 'Common/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/Api/**'
      - 'Common/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/testcraft-api
  MIGRATOR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/testcraft-migrator

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MSBUILDTERMINALLOGGER: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Dockerfile
        shell: sh
        run: |
          wget -qO /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint --ignore DL3018 --ignore DL3059 apps/Api/Dockerfile
          /tmp/hadolint --ignore DL3018 --ignore DL3059 apps/Api/Migrator.Dockerfile

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'apps/Api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TestCraft.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Audit dependencies
        run: |
          dotnet list TestCraft.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.log
          if grep -q "has the following vulnerable packages" vulnerable-packages.log; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Format check
        run: dotnet format style --verify-no-changes --no-restore TestCraft.slnx

      - name: Build
        run: dotnet build TestCraft.slnx --no-restore --configuration Release

      - name: Start TestCraft run
        id: testcraft-start
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft
        with:
          command: start
          username: ${{ secrets.TESTCRAFT_USERNAME }}
          password: ${{ secrets.TESTCRAFT_PASSWORD }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          keycloak-authority: ${{ secrets.TESTCRAFT_KEYCLOAK_AUTHORITY }}
          project-name: TestCraft
          run-name: '#${{ github.run_id }} api (${{ github.ref_name }})'
          source: api

      - name: Test
        run: dotnet test TestCraft.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --settings apps/Api/coverlet.runsettings
        env:
          TESTCRAFT_RUN_ID: ${{ steps.testcraft-start.outputs.run-id }}
          TESTCRAFT_API_URL: ${{ secrets.TESTCRAFT_API_URL }}
          TESTCRAFT_KEYCLOAK_AUTHORITY: ${{ secrets.TESTCRAFT_KEYCLOAK_AUTHORITY }}
          TESTCRAFT_USERNAME: ${{ secrets.TESTCRAFT_USERNAME }}
          TESTCRAFT_PASSWORD: ${{ secrets.TESTCRAFT_PASSWORD }}
          TESTCRAFT_PROJECT_NAME: TestCraft
          TESTCRAFT_SOURCE: api

      - name: Import results to TestCraft
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft
        with:
          username: ${{ secrets.TESTCRAFT_USERNAME }}
          password: ${{ secrets.TESTCRAFT_PASSWORD }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          keycloak-authority: ${{ secrets.TESTCRAFT_KEYCLOAK_AUTHORITY }}
          project-name: TestCraft
          junit-xml: apps/Api/test-results/*.junit.xml
          run-name: '#${{ github.run_id }} api (${{ github.ref_name }})'
          source: api

  docker:
    name: docker build & push
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/Api/Dockerfile
          load: true
          tags: api-scan:${{ github.sha }}
          cache-from: type=gha,scope=api

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: api-scan:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload scan results to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: trivy-results.sarif

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/Api/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: false

      - name: Extract migrator metadata
        id: migrator-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.MIGRATOR_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build migrator image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/Api/Migrator.Dockerfile
          load: true
          tags: migrator-scan:${{ github.sha }}
          cache-from: type=gha,scope=migrator

      - name: Scan migrator image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: migrator-scan:${{ github.sha }}
          format: sarif
          output: trivy-results-migrator.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload migrator scan results to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: trivy-results-migrator.sarif

      - name: Build and push migrator
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/Api/Migrator.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.migrator-meta.outputs.tags }}
          labels: ${{ steps.migrator-meta.outputs.labels }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
          provenance: false

  deploy:
    name: deploy to production
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, testcraft-production]
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Restore production secrets
        run: |
          secrets_file=/home/deploy/repos/TestCraft/infrastructure/helm/testcraft/values.secrets.yaml
          test -f "$secrets_file" || { echo "::error::production secrets file missing at $secrets_file"; exit 1; }
          cp "$secrets_file" infrastructure/helm/testcraft/values.secrets.yaml

      - name: Deploy api
        run: just deploy-app api sha-${{ github.sha }}
