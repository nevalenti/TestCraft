name: release-tag

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/testcraft-api
  MIGRATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/testcraft-migrator
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/testcraft-web
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/testcraft-gateway
  DOCS_IMAGE: ghcr.io/${{ github.repository_owner }}/testcraft-docs

jobs:
  verify-ci:
    name: verify CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          runs=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --paginate | jq -r \
            --arg run_id "${{ github.run_id }}" \
            '.check_runs[] | select((.details_url // "") | contains("/actions/runs/\($run_id)/") | not) | "\(.name)\t\(.status)\t\(.conclusion)"')

          echo "${runs:-<no check runs on this commit>}"

          if echo "$runs" | awk -F'\t' '$2 != "" && $2 != "completed"' | grep -q .; then
            echo "::error::Some check runs on $sha are still in progress — wait for CI to finish before tagging."
            exit 1
          fi

          if echo "$runs" | awk -F'\t' '$3 != "" && $3 != "success" && $3 != "neutral" && $3 != "skipped"' | grep -q .; then
            echo "::error::Some check runs on $sha did not succeed — refusing to release."
            exit 1
          fi

  promote-images:
    permissions:
      contents: read
      packages: write
    name: promote images to ${{ github.ref_name }}
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag latest api/migrator/web/gateway/docs images as the release version
        run: |
          version="$GITHUB_REF_NAME"
          for image in "$API_IMAGE" "$MIGRATOR_IMAGE" "$WEB_IMAGE" "$GATEWAY_IMAGE" "$DOCS_IMAGE"; do
            echo "Promoting $image:latest -> $image:$version"
            docker buildx imagetools create --tag "$image:$version" "$image:latest"
          done

  github-release:
    permissions:
      contents: write
    name: create GitHub release
    needs: promote-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
