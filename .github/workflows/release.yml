name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/testcraft-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/testcraft-web
  DOCS_IMAGE: ghcr.io/${{ github.repository_owner }}/testcraft-docs

jobs:
  verify-ci:
    name: verify CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          runs=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --paginate --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion)"')

          if [ -z "$runs" ]; then
            echo "::error::No check runs found for $sha — refusing to release a commit with no CI evidence."
            exit 1
          fi

          echo "$runs"

          if echo "$runs" | awk -F'\t' '$2 != "completed"' | grep -q .; then
            echo "::error::Some check runs on $sha are still in progress — wait for CI to finish before tagging."
            exit 1
          fi

          if echo "$runs" | awk -F'\t' '$3 != "success" && $3 != "neutral" && $3 != "skipped"' | grep -q .; then
            echo "::error::Some check runs on $sha did not succeed — refusing to release."
            exit 1
          fi

  promote-images:
    name: promote images to ${{ github.ref_name }}
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag api/web/docs images built by CI for this commit
        run: |
          version="${{ github.ref_name }}"
          sha_tag="sha-${{ github.sha }}"
          for image in "$API_IMAGE" "$WEB_IMAGE" "$DOCS_IMAGE"; do
            echo "Promoting $image:$sha_tag -> $image:$version"
            docker buildx imagetools create --tag "$image:$version" "$image:$sha_tag"
          done

  github-release:
    name: create GitHub release
    needs: promote-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
