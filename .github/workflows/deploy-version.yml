name: deploy version

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'app to deploy'
        required: true
        type: choice
        options:
          - api
          - web
          - gateway
          - docs
      version:
        description: 'image tag to deploy: a released version (v1.2.3) or a commit SHA'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy ${{ inputs.app }}@${{ inputs.version }} to production
    runs-on: [self-hosted, testcraft-production]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Restore production secrets
        run: |
          secrets_file=/home/deploy/repos/TestCraft/infrastructure/helm/testcraft/values.secrets.yaml
          test -f "$secrets_file" || { echo "::error::production secrets file missing at $secrets_file"; exit 1; }
          cp "$secrets_file" infrastructure/helm/testcraft/values.secrets.yaml

      - name: Normalize tag
        id: normalize
        run: |
          version="${{ inputs.version }}"
          if [[ "$version" =~ ^[0-9a-f]{40}$ ]]; then
            version="sha-$version"
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: just deploy-app ${{ inputs.app }} ${{ steps.normalize.outputs.tag }}
