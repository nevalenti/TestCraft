name: deploy

on:
  workflow_run:
    workflows: [api, web, gateway, docs]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to production
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, testcraft-production]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore production secrets
        run: |
          cp /home/deploy/repos/TestCraft/infrastructure/helm/testcraft/values.secrets.yaml \
             infrastructure/helm/testcraft/values.secrets.yaml

      - name: Deploy
        run: make deploy-prod
