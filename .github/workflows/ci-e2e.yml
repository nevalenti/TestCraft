name: ci-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml

  e2e:
    name: e2e tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: testcraft_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:4-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 5672:5672

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Load shared e2e config
        run: grep -v '^#' infrastructure/local/keycloak/e2e.env | grep -v '^$' >> "$GITHUB_ENV"

      - name: Render dev realm.json
        run: scripts/render-dev-realm.sh

      - name: Start Keycloak
        run: |
          docker run -d \
            --rm \
            --name keycloak \
            --network host \
            -e KC_HEALTH_ENABLED=true \
            -v ${{ github.workspace }}/infrastructure/shared/keycloak/theme/theme.properties:/opt/keycloak/themes/dracula/login/theme.properties:ro \
            -v ${{ github.workspace }}/infrastructure/shared/keycloak/theme/template.ftl:/opt/keycloak/themes/dracula/login/template.ftl:ro \
            -v ${{ github.workspace }}/infrastructure/shared/keycloak/theme/login.ftl:/opt/keycloak/themes/dracula/login/login.ftl:ro \
            -v ${{ github.workspace }}/infrastructure/shared/keycloak/theme/register.ftl:/opt/keycloak/themes/dracula/login/register.ftl:ro \
            -v ${{ github.workspace }}/infrastructure/shared/keycloak/theme/error.ftl:/opt/keycloak/themes/dracula/login/error.ftl:ro \
            -v ${{ github.workspace }}/infrastructure/shared/keycloak/theme/login-verify-email.ftl:/opt/keycloak/themes/dracula/login/login-verify-email.ftl:ro \
            -v ${{ github.workspace }}/infrastructure/local/keycloak/realm.json:/realm-source/realm.json:ro \
            --entrypoint /bin/sh \
            quay.io/keycloak/keycloak:26.2 \
            -c 'mkdir -p /opt/keycloak/data/import && sed "s|\"GITHUB_IDP_ENABLED\"|false|g; s|\"GOOGLE_IDP_ENABLED\"|false|g" /realm-source/realm.json > /opt/keycloak/data/import/realm.json && exec /opt/keycloak/bin/kc.sh start-dev --import-realm'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API
        run: dotnet restore apps/Api/src/TestCraft.Api/TestCraft.Api.csproj

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @testcraft/types run build

      - name: Check e2e tests and reporter
        run: |
          pnpm --filter testcraft-e2e run typecheck
          pnpm --filter testcraft-e2e run lint
          pnpm --filter testcraft-e2e run test:reporter

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter testcraft-e2e exec playwright install chromium --with-deps

      - name: Wait for Keycloak
        run: timeout 120 sh -c 'until curl -sf http://localhost:9000/health/ready > /dev/null 2>&1; do sleep 3; done'

      - name: Migrate and seed the database
        run: dotnet run --project apps/Api/src/TestCraft.Migrator -- seed
        env:
          DATABASE_URL: postgresql://e2e:e2e@localhost:5433/testcraft_e2e

      - name: Start TestCraft run
        id: testcraft-start
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft # zizmor: ignore[self-repository]
        with:
          command: start
          token: ${{ secrets.TESTCRAFT_TOKEN }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          project-id: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          run-name: "#${{ github.run_id }} e2e (${{ github.ref_name }})"
          source: e2e

      - name: Run e2e tests
        run: pnpm --filter testcraft-e2e run e2e
        env:
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_START_TLS: "false"
          WEB_BASE_URL: http://localhost:4173
          MAILPIT_URL: http://localhost:8025
          DATABASE_URL: postgresql://e2e:e2e@localhost:5433/testcraft_e2e
          REDIS_URL: redis://localhost:6379/1
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          KEYCLOAK_AUTHORITY: http://localhost:8080/realms/testcraft
          VITE_KEYCLOAK_URL: http://localhost:8080
          TESTCRAFT_RUN_ID: ${{ steps.testcraft-start.outputs.run-id }}
          TESTCRAFT_API_URL: ${{ secrets.TESTCRAFT_API_URL }}
          TESTCRAFT_TOKEN: ${{ secrets.TESTCRAFT_TOKEN }}
          TESTCRAFT_PROJECT_ID: ${{ secrets.TESTCRAFT_PROJECT_ID }}

      - name: Import results to TestCraft
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft # zizmor: ignore[self-repository]
        with:
          token: ${{ secrets.TESTCRAFT_TOKEN }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          project-id: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          junit-xml: e2e/e2e-results/junit.xml
          run-name: "#${{ github.run_id }} e2e (${{ github.ref_name }})"
          source: e2e
          screenshots-dir: e2e/test-results

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/e2e-results
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

      - name: Show Keycloak logs
        if: failure()
        continue-on-error: true
        run: docker logs keycloak

  result:
    name: e2e result
    if: always()
    needs: [changes, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required e2e job did not pass"
          exit 1
