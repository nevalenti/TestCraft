name: infra-deploy

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/helm/**"
      - ".github/workflows/infra-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: apply chart changes to production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, testcraft-production]
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main

      - name: Restore production secrets
        run: |
          secrets_file=/home/deploy/repos/TestCraft/infrastructure/helm/testcraft/values.secrets.yaml
          test -f "$secrets_file" || { echo "::error::production secrets file missing at $secrets_file"; exit 1; }
          cp "$secrets_file" infrastructure/helm/testcraft/values.secrets.yaml

      - name: Deploy
        run: just deploy-prod
