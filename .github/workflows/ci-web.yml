name: ci-web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml

  build-test:
    name: build & test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API contract
        run: pnpm run lint:contract

      - name: Check generated SDK
        run: |
          pnpm --filter testcraft-web generate:sdk
          git add -N apps/web/src/api/generated
          git diff --exit-code -- apps/web/src/api/generated

      - name: Lint
        run: pnpm --filter testcraft-web run lint

      - name: Typecheck
        run: pnpm --filter testcraft-web run typecheck

      - name: Build
        run: pnpm turbo build --filter testcraft-web

      - name: Start TestCraft run
        id: testcraft-start
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft # zizmor: ignore[self-repository]
        with:
          command: start
          token: ${{ secrets.TESTCRAFT_TOKEN }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          project-id: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          run-name: "#${{ github.run_id }} web (${{ github.ref_name }})"
          source: web

      - name: Test
        run: pnpm --filter testcraft-web run test:coverage
        env:
          TESTCRAFT_RUN_ID: ${{ steps.testcraft-start.outputs.run-id }}
          TESTCRAFT_API_URL: ${{ secrets.TESTCRAFT_API_URL }}
          TESTCRAFT_TOKEN: ${{ secrets.TESTCRAFT_TOKEN }}
          TESTCRAFT_PROJECT_ID: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          TESTCRAFT_SOURCE: web

      - name: Import results to TestCraft
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft # zizmor: ignore[self-repository]
        with:
          token: ${{ secrets.TESTCRAFT_TOKEN }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          project-id: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          junit-xml: apps/web/test-results/junit.xml
          run-name: "#${{ github.run_id }} web (${{ github.ref_name }})"
          source: web

      - name: Upload test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-test-results
          path: apps/web/test-results
          retention-days: 7

  docker:
    name: docker (web)
    needs: build-test
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/reusable-image.yml # zizmor: ignore[self-repository]
    with:
      name: web
      dockerfile: apps/web/Dockerfile
      build-args: |
        VITE_API_URL=https://testcraft.pro
        VITE_KEYCLOAK_URL=https://auth.testcraft.pro
        VITE_KEYCLOAK_REALM=testcraft
        VITE_KEYCLOAK_CLIENT_ID=testcraft-web
        VITE_GLITCHTIP_DSN=${{ vars.VITE_GLITCHTIP_DSN }}
        VITE_RELEASE=${{ github.sha }}
        VITE_ENVIRONMENT=production
      push-build-args: |
        SENTRY_URL=${{ vars.GLITCHTIP_URL }}
        SENTRY_ORG=${{ vars.GLITCHTIP_ORG }}
        SENTRY_PROJECT=${{ vars.GLITCHTIP_WEB_PROJECT }}
    secrets:
      glitchtip_auth_token: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}

  result:
    name: web result
    if: always()
    needs: [changes, build-test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required web job did not pass"
          exit 1

  deploy:
    name: deploy to production
    needs: docker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.AUTO_DEPLOY_PRODUCTION == 'true'))
    uses: ./.github/workflows/reusable-deploy.yml # zizmor: ignore[self-repository]
    with:
      app: web
      tag: sha-${{ github.sha }}
