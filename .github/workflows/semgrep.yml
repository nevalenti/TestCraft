name: semgrep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

env:
  SEMGREP_CONFIGS: >-
    --config p/security-audit
    --config p/owasp-top-ten
    --config p/csharp
    --config p/typescript
    --config p/javascript

jobs:
  scan:
    name: sast scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep==1.170.0

      - name: Run Semgrep on pull request diff
        if: github.event_name == 'pull_request'
        run: |
          semgrep scan $SEMGREP_CONFIGS \
            --baseline-commit "${{ github.event.pull_request.base.sha }}" \
            --sarif --output semgrep.sarif \
            --error

      - name: Run Semgrep full scan
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          semgrep scan $SEMGREP_CONFIGS \
            --sarif --output semgrep.sarif

      - name: Upload results to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: semgrep.sarif
