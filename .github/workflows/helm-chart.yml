name: helm-chart

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/helm/**"
      - ".github/workflows/helm-chart.yml"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/helm/**"
      - ".github/workflows/helm-chart.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-template:
    name: lint & template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Helm dependency update
        run: helm dependency update infrastructure/helm/testcraft

      - name: Helm lint
        run: helm lint infrastructure/helm/testcraft

      - name: Helm template (default values)
        run: helm template testcraft infrastructure/helm/testcraft --namespace testcraft > /dev/null

      - name: Helm template (production values, dummy secrets)
        run: |
          helm template testcraft infrastructure/helm/testcraft --namespace testcraft \
            --values infrastructure/helm/testcraft/values.production.yaml \
            --values infrastructure/helm/testcraft/values.secrets.yaml.example \
            > /dev/null
