name: ci-api

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml

  build-test:
    name: build & test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MSBUILDTERMINALLOGGER: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'apps/Api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TestCraft.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Format check
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build TestCraft.slnx --no-restore --configuration Release

      - name: Start TestCraft run
        id: testcraft-start
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft # zizmor: ignore[self-repository]
        with:
          command: start
          token: ${{ secrets.TESTCRAFT_TOKEN }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          project-id: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          run-name: "#${{ github.run_id }} api (${{ github.ref_name }})"
          source: api

      - name: Test
        run: dotnet test TestCraft.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --settings apps/Api/coverlet.runsettings
        env:
          TESTCRAFT_RUN_ID: ${{ steps.testcraft-start.outputs.run-id }}
          TESTCRAFT_API_URL: ${{ secrets.TESTCRAFT_API_URL }}
          TESTCRAFT_TOKEN: ${{ secrets.TESTCRAFT_TOKEN }}
          TESTCRAFT_PROJECT_ID: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          TESTCRAFT_SOURCE: api

      - name: Import results to TestCraft
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft # zizmor: ignore[self-repository]
        with:
          token: ${{ secrets.TESTCRAFT_TOKEN }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          project-id: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          junit-xml: apps/Api/test-results/*.junit.xml
          run-name: "#${{ github.run_id }} api (${{ github.ref_name }})"
          source: api

      - name: Upload test results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-results
          path: apps/Api/test-results
          retention-days: 7

  docker-api:
    name: docker (api)
    needs: build-test
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/reusable-image.yml # zizmor: ignore[self-repository]
    with:
      name: api
      dockerfile: apps/Api/Dockerfile

  docker-migrator:
    name: docker (migrator)
    needs: build-test
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/reusable-image.yml # zizmor: ignore[self-repository]
    with:
      name: migrator
      dockerfile: apps/Api/Migrator.Dockerfile

  result:
    name: api result
    if: always()
    needs: [changes, build-test, docker-api, docker-migrator]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required api job did not pass"
          exit 1

  deploy:
    name: deploy to production
    needs: [docker-api, docker-migrator]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.AUTO_DEPLOY_PRODUCTION == 'true'))
    uses: ./.github/workflows/reusable-deploy.yml # zizmor: ignore[self-repository]
    with:
      app: api
      tag: sha-${{ github.sha }}
