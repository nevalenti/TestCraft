name: infra-deploy-version

on:
  workflow_dispatch:
    inputs:
      app:
        description: "app to deploy"
        required: true
        type: choice
        options:
          - api
          - web
          - gateway
          - docs
      version:
        description: "image tag to deploy: a released version (v1.2.3) or a commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.app }}@${{ inputs.version }} to production
    uses: ./.github/workflows/reusable-deploy.yml # zizmor: ignore[self-repository]
    with:
      app: ${{ inputs.app }}
      tag: ${{ inputs.version }}
