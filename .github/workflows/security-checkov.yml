name: security-checkov

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: checkov-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.iac == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml

  scan:
    name: iac security scan
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.3.11

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "v3.16.4"

      - name: Helm dependency update
        run: helm dependency update infrastructure/helm/testcraft

      - name: Scan Helm chart
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          checkov -d infrastructure/helm/testcraft --framework helm \
            --baseline infrastructure/helm/testcraft/.checkov.baseline \
            -o cli -o sarif --output-file-path console,checkov-helm.sarif

      - name: Scan Dockerfiles
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          checkov -d . --framework dockerfile \
            --baseline .checkov.baseline \
            -o cli -o sarif --output-file-path console,checkov-dockerfile.sarif

      - name: Upload Helm results to Security tab
        if: always() && hashFiles('checkov-helm.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: checkov-helm.sarif
          category: checkov-helm

      - name: Upload Dockerfile results to Security tab
        if: always() && hashFiles('checkov-dockerfile.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: checkov-dockerfile.sarif
          category: checkov-dockerfile

  result:
    name: iac result
    if: always()
    needs: [changes, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required iac job did not pass"
          exit 1
