name: ci-gateway

on:
  push:
    branches: [main]
    paths:
      - "apps/Gateway/**"
      - ".github/workflows/ci-gateway.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/Gateway/**"
      - ".github/workflows/ci-gateway.yml"
  workflow_dispatch:

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        shell: sh
        run: |
          wget -qO /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint --ignore DL3018 --ignore DL3059 apps/Gateway/Dockerfile

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'apps/Gateway/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TestCraft.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Format check
        run: dotnet csharpier check apps/Gateway

      - name: Build
        run: |
          dotnet build apps/Gateway/src/TestCraft.Gateway/TestCraft.Gateway.csproj --no-restore --configuration Release
          dotnet build apps/Gateway/tests/TestCraft.Gateway.Tests/TestCraft.Gateway.Tests.csproj --no-restore --configuration Release

      - name: Start TestCraft run
        id: testcraft-start
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft # zizmor: ignore[self-repository]
        with:
          command: start
          token: ${{ secrets.TESTCRAFT_TOKEN }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          project-id: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          run-name: "#${{ github.run_id }} gateway (${{ github.ref_name }})"
          source: gateway

      - name: Test
        run: dotnet test apps/Gateway/tests/TestCraft.Gateway.Tests/TestCraft.Gateway.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --settings apps/Gateway/coverlet.runsettings
        env:
          TESTCRAFT_RUN_ID: ${{ steps.testcraft-start.outputs.run-id }}
          TESTCRAFT_API_URL: ${{ secrets.TESTCRAFT_API_URL }}
          TESTCRAFT_TOKEN: ${{ secrets.TESTCRAFT_TOKEN }}
          TESTCRAFT_PROJECT_ID: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          TESTCRAFT_SOURCE: gateway

      - name: Import results to TestCraft
        if: always()
        continue-on-error: true
        uses: ./.github/actions/testcraft # zizmor: ignore[self-repository]
        with:
          token: ${{ secrets.TESTCRAFT_TOKEN }}
          api-url: ${{ secrets.TESTCRAFT_API_URL }}
          project-id: ${{ secrets.TESTCRAFT_PROJECT_ID }}
          junit-xml: apps/Gateway/test-results/*.junit.xml
          run-name: "#${{ github.run_id }} gateway (${{ github.ref_name }})"
          source: gateway

  docker:
    name: docker (gateway)
    needs: build-test
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/reusable-image.yml # zizmor: ignore[self-repository]
    with:
      name: gateway
      dockerfile: apps/Gateway/Dockerfile
      build-args: |
        GIT_SHA=${{ github.sha }}

  deploy:
    name: deploy to production
    needs: docker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.AUTO_DEPLOY_PRODUCTION == 'true'))
    uses: ./.github/workflows/reusable-deploy.yml # zizmor: ignore[self-repository]
    with:
      app: gateway
      tag: sha-${{ github.sha }}
