name: reusable-image

on:
  workflow_call:
    inputs:
      name:
        description: "short image name; the image is ghcr.io/<owner>/testcraft-<name>"
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      build-args:
        description: "newline-separated build args for the scan and the final build"
        required: false
        type: string
        default: ""
      push-build-args:
        description: "extra newline-separated build args for the final build only"
        required: false
        type: string
        default: ""
    secrets:
      glitchtip_auth_token:
        required: false

permissions:
  contents: read

jobs:
  image:
    name: build, scan & push ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      PUBLISH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/testcraft-${{ inputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ inputs.name }}-scan:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APK_CACHE_BUST=${{ steps.date.outputs.date }}
            ${{ inputs.build-args }}
            ${{ env.PUBLISH == 'true' && inputs.push-build-args || '' }}
          secrets: |
            glitchtip_auth_token=${{ env.PUBLISH == 'true' && secrets.glitchtip_auth_token || '' }}
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}
          provenance: false

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.name }}-scan:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload scan results to Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ inputs.name }}

      - name: Push image
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done
