apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: testcraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: testcraft-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: DATABASE_URL
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              value: redis://redis:6379
            - name: KEYCLOAK_AUTHORITY
              value: http://keycloak:8080/realms/testcraft
            - name: KEYCLOAK_AUDIENCE
              value: testcraft-web
            - name: KEYCLOAK_REQUIRE_HTTPS_METADATA
              value: "false"
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: CORS_ALLOWED_ORIGINS
            - name: LOKI_URL
              value: http://loki:3100
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: testcraft-secrets
                  key: METRICS_TOKEN
                  optional: true
            - name: APPLY_MIGRATIONS
              value: "true"
            - name: SEED_DATA
              value: "false"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
              cpu: "100m"
            limits:
              memory: 512Mi
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: testcraft
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
