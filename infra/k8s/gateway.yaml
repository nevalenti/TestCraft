apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: testcraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
            - containerPort: 443
            - containerPort: 8443
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 16Mi
              cpu: "50m"
            limits:
              memory: 64Mi
              cpu: "250m"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-gateway-config
        - name: tls
          secret:
            secretName: rpi5-tls
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: testcraft
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: keycloak-https
      port: 8443
      targetPort: 8443
