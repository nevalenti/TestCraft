variables:
  DOCS_IMAGE: $CI_REGISTRY_IMAGE/testcraft-docs

docs:build-test:
  stage: build-test
  image: node:24-bookworm-slim
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - 'apps/docs/**/*'
        - 'pnpm-lock.yaml'
        - '.gitlab/ci/docs.yml'
  variables:
    TESTCRAFT_PROJECT_NAME: TestCraft
    TESTCRAFT_SOURCE: docs
    TESTCRAFT_JUNIT_XML: apps/docs/test-results/*.junit.xml
    TESTCRAFT_RUN_NAME: '#$CI_PIPELINE_IID docs ($CI_COMMIT_REF_NAME)'
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable && corepack prepare pnpm@10.34.5 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter testcraft-ci-reporter run build
    - node packages/ci-reporter/dist/cli.js start --dotenv testcraft.env || true
    - if [ -f testcraft.env ]; then set -a; . ./testcraft.env; set +a; fi
    - pnpm --filter testcraft-docs run typecheck
    - pnpm turbo build --filter testcraft-docs
  after_script:
    - node packages/ci-reporter/dist/cli.js import || true
  artifacts:
    when: always
    reports:
      junit: apps/docs/test-results/*.junit.xml
    paths:
      - apps/docs/test-results/
      - apps/docs/dist/
    expire_in: 7 days

docs:docker:
  stage: docker
  image: docker:27
  needs:
    - docs:build-test
  services:
    - docker:27-dind
  timeout: 15m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - 'apps/docs/**/*'
        - 'pnpm-lock.yaml'
        - '.gitlab/ci/docs.yml'
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - curl -sSL -o /tmp/gitlab.tpl https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl
  script:
    - docker build -t $DOCS_IMAGE:$CI_COMMIT_SHA -f apps/docs/Dockerfile .
    - trivy image --format template --template "@/tmp/gitlab.tpl" -o gl-container-scanning-report.json --severity CRITICAL,HIGH --ignore-unfixed $DOCS_IMAGE:$CI_COMMIT_SHA
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker tag $DOCS_IMAGE:$CI_COMMIT_SHA $DOCS_IMAGE:latest
        docker tag $DOCS_IMAGE:$CI_COMMIT_SHA $DOCS_IMAGE:$CI_COMMIT_REF_SLUG
        docker push $DOCS_IMAGE:$CI_COMMIT_SHA
        docker push $DOCS_IMAGE:latest
        docker push $DOCS_IMAGE:$CI_COMMIT_REF_SLUG
      fi
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
