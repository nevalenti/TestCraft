variables:
  WEB_IMAGE: $CI_REGISTRY_IMAGE/testcraft-web

web:build-test:
  stage: build-test
  image: node:24-bookworm-slim
  timeout: 15m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - "apps/web/**/*"
        - "packages/**/*"
        - "pnpm-lock.yaml"
        - ".gitlab/ci/web.yml"
  variables:
    TESTCRAFT_PROJECT_NAME: TestCraft
    TESTCRAFT_SOURCE: web
    TESTCRAFT_JUNIT_XML: apps/web/test-results/junit.xml
    TESTCRAFT_RUN_NAME: "#$CI_PIPELINE_IID web ($CI_COMMIT_REF_NAME)"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable && corepack prepare pnpm@11.3.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm audit --audit-level=high --filter testcraft-web
    - pnpm --filter testcraft-web run lint
    - pnpm --filter testcraft-web run typecheck
    - pnpm turbo build --filter testcraft-web
    - pnpm --filter @testcraft/ci-reporter run build
    - node packages/ci-reporter/dist/cli.js start --dotenv testcraft.env || true
    - if [ -f testcraft.env ]; then set -a; . ./testcraft.env; set +a; fi
    - pnpm --filter testcraft-web run test
  after_script:
    - node packages/ci-reporter/dist/cli.js import || true
  artifacts:
    when: always
    reports:
      junit: apps/web/test-results/junit.xml
    paths:
      - apps/web/test-results/
      - apps/web/dist/
    expire_in: 7 days

pages:
  stage: pages
  image: alpine:3.20
  needs:
    - web:build-test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "apps/web/**/*"
        - "packages/**/*"
        - "pnpm-lock.yaml"
        - ".gitlab/ci/web.yml"
  script:
    - mkdir -p public
    - cp -r apps/web/test-results/. public/ 2>/dev/null || true
  artifacts:
    paths:
      - public

web:docker:
  stage: docker
  image: docker:27
  needs:
    - web:build-test
  services:
    - docker:27-dind
  timeout: 15m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - "apps/web/**/*"
        - "packages/**/*"
        - "pnpm-lock.yaml"
        - ".gitlab/ci/web.yml"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - curl -sSL -o /tmp/gitlab.tpl https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl
  script:
    - docker build -t $WEB_IMAGE:$CI_COMMIT_SHA -f apps/web/Dockerfile .
    - trivy image --format template --template "@/tmp/gitlab.tpl" -o gl-container-scanning-report.json --severity CRITICAL,HIGH --ignore-unfixed $WEB_IMAGE:$CI_COMMIT_SHA
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker tag $WEB_IMAGE:$CI_COMMIT_SHA $WEB_IMAGE:latest
        docker tag $WEB_IMAGE:$CI_COMMIT_SHA $WEB_IMAGE:$CI_COMMIT_REF_SLUG
        docker push $WEB_IMAGE:$CI_COMMIT_SHA
        docker push $WEB_IMAGE:latest
        docker push $WEB_IMAGE:$CI_COMMIT_REF_SLUG
      fi
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
