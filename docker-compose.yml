services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: testcraft-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE}
    container_name: testcraft-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    container_name: testcraft-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${POSTGRES_USER}
      RABBITMQ_DEFAULT_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE}
    container_name: testcraft-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: ${KEYCLOAK_IMAGE}
    container_name: testcraft-keycloak
    entrypoint: /bin/sh
    command:
      - -c
      - |
        GITHUB_ENABLED="$${GITHUB_CLIENT_ID:+true}"; GITHUB_ENABLED="$${GITHUB_ENABLED:-false}"
        GOOGLE_ENABLED="$${GOOGLE_CLIENT_ID:+true}"; GOOGLE_ENABLED="$${GOOGLE_ENABLED:-false}"
        mkdir -p /opt/keycloak/data/import
        sed "s|\"GITHUB_IDP_ENABLED\"|$$GITHUB_ENABLED|g; s|\$${GITHUB_CLIENT_ID}|$$GITHUB_CLIENT_ID|g; s|\$${GITHUB_CLIENT_SECRET}|$$GITHUB_CLIENT_SECRET|g; s|\"GOOGLE_IDP_ENABLED\"|$$GOOGLE_ENABLED|g; s|\$${GOOGLE_CLIENT_ID}|$$GOOGLE_CLIENT_ID|g; s|\$${GOOGLE_CLIENT_SECRET}|$$GOOGLE_CLIENT_SECRET|g" \
          /realm-source/realm.json > /opt/keycloak/data/import/realm.json
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9100"
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/helm/testcraft/files/theme.properties:/opt/keycloak/themes/dracula/login/theme.properties:ro
      - ./infrastructure/helm/testcraft/files/template.ftl:/opt/keycloak/themes/dracula/login/template.ftl:ro
      - ./infrastructure/helm/testcraft/files/login.ftl:/opt/keycloak/themes/dracula/login/login.ftl:ro
      - ./infrastructure/helm/testcraft/files/register.ftl:/opt/keycloak/themes/dracula/login/register.ftl:ro
      - ./infrastructure/helm/testcraft/files/error.ftl:/opt/keycloak/themes/dracula/login/error.ftl:ro
      - ./infrastructure/helm/testcraft/files/login-verify-email.ftl:/opt/keycloak/themes/dracula/login/login-verify-email.ftl:ro
      - ./infrastructure/keycloak/realm.json:/realm-source/realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/localhost/9100 && echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "UP" <&3',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: testcraft-grafana
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/helm/testcraft/files/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infrastructure/helm/testcraft/files/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infrastructure/helm/testcraft/files/api-logs.json:/etc/grafana/provisioning/dashboards/api-logs.json:ro
      - ./infrastructure/helm/testcraft/files/api-http.json:/etc/grafana/provisioning/dashboards/api-http.json:ro
      - ./infrastructure/helm/testcraft/files/redis-metrics.json:/etc/grafana/provisioning/dashboards/redis-metrics.json:ro
      - ./infrastructure/helm/testcraft/files/postgres-metrics.json:/etc/grafana/provisioning/dashboards/postgres-metrics.json:ro
      - ./infrastructure/helm/testcraft/files/rabbitmq-metrics.json:/etc/grafana/provisioning/dashboards/rabbitmq-metrics.json:ro
      - ./infrastructure/helm/testcraft/files/k8s-cluster.json:/etc/grafana/provisioning/dashboards/k8s-cluster.json:ro
      - ./infrastructure/helm/testcraft/files/k8s-node.json:/etc/grafana/provisioning/dashboards/k8s-node.json:ro
      - ./infrastructure/helm/testcraft/files/k8s-pods.json:/etc/grafana/provisioning/dashboards/k8s-pods.json:ro
    depends_on:
      - prometheus
      - loki
      - alertmanager

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: testcraft-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/helm/testcraft/files/alert-rules.yml:/etc/prometheus/rules/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    container_name: testcraft-alertmanager
    volumes:
      - ./infrastructure/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - mailpit

  loki:
    image: ${LOKI_IMAGE}
    container_name: testcraft-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  seq:
    image: ${SEQ_IMAGE}
    container_name: testcraft-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: testcraft-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE}
    container_name: testcraft-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE}
    container_name: testcraft-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  rabbitmq-exporter:
    image: ${RABBITMQ_EXPORTER_IMAGE}
    container_name: testcraft-rabbitmq-exporter
    environment:
      RABBIT_URL: "http://rabbitmq:15672"
      RABBIT_USER: ${POSTGRES_USER}
      RABBIT_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  keycloak_data:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  seq_data:
