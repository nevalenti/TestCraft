services:
  redis:
    restart: always
    networks:
      - backend
    image: redis:${REDIS_VERSION:-7-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  postgres:
    restart: always
    networks:
      - backend
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"

  loki:
    restart: always
    networks:
      - backend
    image: grafana/loki:${LOKI_VERSION:-3.4.3}
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  tempo:
    restart: always
    networks:
      - backend
    image: grafana/tempo:${TEMPO_VERSION:-2.7.1}
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  prometheus:
    restart: always
    networks:
      - backend
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.4.0}
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  grafana:
    restart: always
    networks:
      - backend
    image: grafana/grafana:${GRAFANA_VERSION:-11.6.0}
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - tempo
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  keycloak:
    restart: always
    networks:
      - backend
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.2}
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/localhost/9000 && echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "UP" <&3',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"

  api:
    restart: always
    networks:
      - backend
    image: testcraft-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_SERVICE_NAME: testcraft-api
      LOKI_URL: http://loki:3100
      REDIS_URL: redis://redis:6379
      KEYCLOAK_AUTHORITY: http://keycloak:8080/realms/testcraft
      KEYCLOAK_AUDIENCE: testcraft-web
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"

  web:
    restart: always
    networks:
      - backend
    image: testcraft-web:${IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  gateway:
    restart: always
    networks:
      - backend
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/production.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

volumes:
  postgres_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  keycloak_data:

networks:
  backend:
    driver: bridge
